# 이지스톡 Supabase 프로젝트 설정.
# 단일 프로젝트 (1차 MVP). project_ref는 `supabase link --project-ref <ref>`로 연결.
#
# 변경 시 supabase CLI 버전과 호환성 확인:
#   supabase --version
#
# Reference: https://supabase.com/docs/guides/cli/config

project_id = "easystock"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = false  # 1차 MVP 미사용 (spec Q4 last-write-wins 결정)

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false  # 1차 MVP 미사용 (이미지 업로드 등 사용 사례 없음)
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://easystock.vercel.app"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
enable_confirmations = false  # 1차 MVP 단순화 — 추후 활성화
double_confirm_changes = true
secure_password_change = true

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions]
verify_jwt = true

[analytics]
enabled = false
port = 54327

[experimental]
orioledb_version = ""
