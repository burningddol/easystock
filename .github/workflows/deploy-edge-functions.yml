name: Deploy Edge Functions

on:
  push:
    branches: [master, 001-mvp-core]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$(ls -A supabase/functions 2>/dev/null | grep -v .gitkeep)" ]; then
            echo "No functions to deploy yet (only .gitkeep). Skipping."
            exit 0
          fi
          for fn in supabase/functions/*/; do
            name=$(basename "$fn")
            echo "Deploying $name..."
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"
          done
